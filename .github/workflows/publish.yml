name: publish

# Publishes to PyPI when a GitHub release is published. Authentication uses
# PyPI trusted publishing, so there is no token stored anywhere.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # lets PyPI verify this run came from this repo
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(uv version --short)" = "$TAG"
      - run: uv sync
      - run: uv run pytest
      - run: uv build
      - run: uv publish
